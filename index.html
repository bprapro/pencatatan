<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Meteran LOGSET</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Signature Pad Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <div class="max-w-md mx-auto p-4">
        <!-- HEADER -->
        <div class="bg-blue-600 text-white p-4 rounded-t-2xl shadow-lg text-center">
            <h1 class="text-xl font-bold">Form Pencatatan LOGSET</h1>
            <p class="text-xs opacity-80">Sistem Input & Monitoring Utility</p>
        </div>

        <!-- FORM PENCATATAN -->
        <div class="bg-white p-5 rounded-b-2xl shadow-lg space-y-4">
            <form id="utilityForm" class="space-y-4">
                <input type="hidden" id="editingRowIndex" value="">

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Kategori Sheet</label>
                    <select id="kategoriSheet" class="w-full border rounded-lg p-2 text-sm">
                        <option value="ELECTRICITY">ELECTRICITY</option>
                        <option value="WATER">WATER</option>
                        <option value="GAS">GAS</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nama Tenant / Lokasi</label>
                    <input type="text" id="namaTenant" class="w-full border rounded-lg p-2 text-sm" placeholder="Contoh: Tenant A" required>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">No Lot</label>
                        <input type="text" id="noLot" class="w-full border rounded-lg p-2 text-sm" placeholder="Lot-01">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Serial Number</label>
                        <input type="text" id="serialNumber" class="w-full border rounded-lg p-2 text-sm" placeholder="SN123456">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Zona</label>
                        <input type="text" id="zona" class="w-full border rounded-lg p-2 text-sm" placeholder="Lantai 1">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Jenis Pencatatan</label>
                        <select id="jenisPencatatan" class="w-full border rounded-lg p-2 text-sm">
                            <option value="Awal Bulan">Awal Bulan</option>
                            <option value="Akhir Bulan">Akhir Bulan</option>
                            <option value="Harian">Harian</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Angka Stand Meter</label>
                    <input type="number" step="any" id="angka" class="w-full border rounded-lg p-2 text-sm font-mono" placeholder="0000.00" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nama Teknisi</label>
                    <input type="text" id="namaTeknisi" class="w-full border rounded-lg p-2 text-sm" placeholder="Nama petugas" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Nama Penandatangan Tenant</label>
                    <input type="text" id="namaPenandatanganTenant" class="w-full border rounded-lg p-2 text-sm" placeholder="Nama wakil tenant" required>
                </div>

                <!-- AMBIL FOTO -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Foto Meteran (Watermark Auto)</label>
                    <input type="file" id="fotoInput" accept="image/*" capture="environment" class="w-full text-xs text-gray-500 border rounded-lg p-1">
                    <div id="fotoPreviewContainer" class="mt-2 hidden">
                        <img id="fotoPreview" class="w-full h-40 object-cover rounded-lg border">
                    </div>
                </div>

                <!-- TANDA TANGAN TEKNISI -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-700">TTD Teknisi</label>
                        <button type="button" onclick="padTeknisi.clear()" class="text-[10px] text-red-500 underline">Clear</button>
                    </div>
                    <canvas id="canvasTeknisi" class="w-full h-24 border rounded-lg bg-gray-50"></canvas>
                </div>

                <!-- TANDA TANGAN TENANT -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-gray-700">TTD Tenant</label>
                        <button type="button" onclick="padTenant.clear()" class="text-[10px] text-red-500 underline">Clear</button>
                    </div>
                    <canvas id="canvasTenant" class="w-full h-24 border rounded-lg bg-gray-50"></canvas>
                </div>

                <!-- NOTIFIKASI MODE EDIT -->
                <div id="editModeNotice" class="hidden bg-amber-100 text-amber-800 p-2 rounded text-xs flex justify-between items-center">
                    <span>Sedang dalam Mode Edit Data</span>
                    <button type="button" onclick="cancelEditMode()" class="font-bold underline text-red-600">Batal Edit</button>
                </div>

                <!-- TOMBOL SUBMIT -->
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md transition">
                    Kirim Data Pencatatan
                </button>
            </form>
        </div>

        <!-- RIWAYAT PENCATATAN LOGSET -->
        <div class="bg-white mt-6 p-4 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-gray-800 text-sm flex items-center gap-1">
                    📋 Riwayat LOGSET (Terakhir)
                </h2>
                <button type="button" onclick="fetchHistory()" class="text-xs text-blue-600 font-semibold hover:underline">🔄 Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-gray-100 text-gray-600">
                        <tr>
                            <th class="p-2">Kategori & Tenant</th>
                            <th class="p-2">Jenis</th>
                            <th class="p-2">Angka</th>
                            <th class="p-2 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="4" class="p-3 text-center text-gray-400">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL UCAPAN TERIMA KASIH -->
    <div id="thankYouModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm w-full text-center transform transition-all border border-gray-100">
            <!-- Foto Profil / Icon Success -->
            <div class="relative w-32 h-32 mx-auto mb-4">
                <img src="./foto rico.png" alt="Rico" class="w-full h-full object-cover rounded-full shadow-lg border-4 border-blue-500">
                <div class="absolute bottom-0 right-0 bg-green-500 text-white p-1.5 rounded-full border-2 border-white shadow">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>
            
            <h3 class="text-xl font-bold text-gray-800 mb-1">Terima Kasih!</h3>
            <p class="text-xs text-gray-500 mb-6">Data pencatatan meteran berhasil tersimpan ke sistem LOGSET.</p>
            
            <button type="button" id="btnIsiBaru" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg transform active:scale-95 transition flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Isi Baru Data Pencatatan
            </button>
        </div>
    </div>

    <script>
        // GANTI URL DI BAWAH INI DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIZRUVgCOfgzC9YhrQd-VlEexaZExoBGxy4gUMULoPxlJiwp3oFlM10O0NNt_05-s0bQ/exec";

        let padTeknisi, padTenant;
        let fotoBase64WithWatermark = "";
        let historyList = [];

        function cleanName(name) {
            return name ? name.toString().trim() : "";
        }

        window.onload = function() {
            // Inisialisasi Tanda Tangan
            const canvas1 = document.getElementById('canvasTeknisi');
            const canvas2 = document.getElementById('canvasTenant');
            
            padTeknisi = new SignaturePad(canvas1);
            padTenant = new SignaturePad(canvas2);

            function resizeCanvas() {
                const ratio = Math.max(window.devicePixelRatio || 1, 1);
                [canvas1, canvas2].forEach(canvas => {
                    canvas.width = canvas.offsetWidth * ratio;
                    canvas.height = canvas.offsetHeight * ratio;
                    canvas.getContext("2d").scale(ratio, ratio);
                });
                padTeknisi.clear();
                padTenant.clear();
            }
            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();

            fetchHistory();
        };

        // HANDLER PENGOLAHAN FOTO DENGAN WATERMARK
        document.getElementById('fotoInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;

                    // Draw Original Image
                    ctx.drawImage(img, 0, 0);

                    // Watermark Setting
                    const now = new Date();
                    const timeStr = now.toLocaleString('id-ID');
                    const text = `LOGSET | ${timeStr}`;

                    const fontSize = Math.max(16, Math.floor(canvas.width / 25));
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 6;
                    
                    ctx.fillText(text, 20, canvas.height - 30);

                    fotoBase64WithWatermark = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Display Preview
                    document.getElementById('fotoPreview').src = fotoBase64WithWatermark;
                    document.getElementById('fotoPreviewContainer').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        // MEMUAT RIWAYAT DENGAN PENANGANAN DATA HEADER
        async function fetchHistory() {
            const tbody = document.getElementById('historyTableBody');
            try {
                const res = await fetch(`${SCRIPT_URL}?action=GET_HISTORY`);
                const jsonRes = await res.json();
                historyList = jsonRes.data || [];

                tbody.innerHTML = '';
                if (historyList.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-gray-400">Belum ada riwayat di LOGSET</td></tr>`;
                    return;
                }

                historyList.forEach((item, index) => {
                    // Penanganan fallback key JSON dari Google Sheet
                    const rawNama = item["NAMA TENANT"] || item["Nama Tenant"] || item.namaTenant || "";
                    const rawKategori = item["KATEGORI SHEET"] || item["Kategori Sheet"] || item.kategoriSheet || "-";
                    const rawLot = item["NO LOT"] || item["No Lot"] || item.noLot || "-";
                    const rawSn = item["SERIAL NUMBER"] || item["SN"] || item.serialNumber || item.sn || "-";
                    const rawJenis = item["JENIS PENCATATAN"] || item["Jenis Pencatatan"] || item.jenisPencatatan || item.jenis || "-";
                    const rawAngka = item["ANGKA"] || item["Angka"] || item.angka || "-";

                    const cleanNamaDisplay = cleanName(rawNama) || rawLot || "Tanpa Nama";

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="p-2">
                            <span class="text-[10px] bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded font-bold">${rawKategori}</span>
                            <div class="font-bold text-gray-800 mt-1">${cleanNamaDisplay}</div>
                            <div class="text-[10px] text-gray-500">Lot: ${rawLot} | SN: ${rawSn}</div>
                        </td>
                        <td class="p-2 font-semibold">${rawJenis}</td>
                        <td class="p-2 font-mono font-bold text-blue-600">${rawAngka}</td>
                        <td class="p-2 text-center">
                            <button type="button" onclick="editHistoryItem(${index})" class="bg-amber-500 text-white px-2 py-1 rounded text-[10px] font-semibold hover:bg-amber-600 shadow">✏️ Edit</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-red-500">Gagal memuat riwayat</td></tr>`;
            }
        }

        // FUNGSI UNTUK MENAMPILKAN MODAL TERIMA KASIH
        function showThankYouModal() {
            document.getElementById('thankYouModal').classList.remove('hidden');
        }

        // FUNGSI UNTUK RESET FORM DAN SIAP ISI BARU
        function resetAndPrepareNewForm() {
            document.getElementById('thankYouModal').classList.add('hidden');
            document.getElementById('utilityForm').reset();
            cancelEditMode();
            padTeknisi.clear();
            padTenant.clear();
            fotoBase64WithWatermark = "";
            document.getElementById('fotoPreviewContainer').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // EVENT LISTENER TOMBOL ISI BARU
        document.getElementById('btnIsiBaru').onclick = resetAndPrepareNewForm;

        // EDIT MODE
        function editHistoryItem(index) {
            const item = historyList[index];
            if (!item) return;

            document.getElementById('editingRowIndex').value = index + 2; // +2 untuk baris sheet (karena header row 1)
            document.getElementById('kategoriSheet').value = item["KATEGORI SHEET"] || item.kategoriSheet || "ELECTRICITY";
            document.getElementById('namaTenant').value = item["NAMA TENANT"] || item.namaTenant || "";
            document.getElementById('noLot').value = item["NO LOT"] || item.noLot || "";
            document.getElementById('serialNumber').value = item["SERIAL NUMBER"] || item.serialNumber || "";
            document.getElementById('zona').value = item["ZONA"] || item.zona || "";
            document.getElementById('jenisPencatatan').value = item["JENIS PENCATATAN"] || item.jenisPencatatan || "Awal Bulan";
            document.getElementById('angka').value = item["ANGKA"] || item.angka || "";
            document.getElementById('namaTeknisi').value = item["NAMA TEKNISI"] || item.namaTeknisi || "";
            document.getElementById('namaPenandatanganTenant').value = item["NAMA TENANT PENANDATANGAN"] || item.namaPenandatanganTenant || "";

            document.getElementById('editModeNotice').classList.remove('hidden');
            document.getElementById('submitBtn').innerText = 'Update Data Pencatatan';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEditMode() {
            document.getElementById('editingRowIndex').value = '';
            document.getElementById('editModeNotice').classList.add('hidden');
            document.getElementById('submitBtn').innerText = 'Kirim Data Pencatatan';
        }

        // FORM SUBMIT
        document.getElementById('utilityForm').onsubmit = async function(e) {
            e.preventDefault();
            const editingRowIndex = document.getElementById('editingRowIndex').value;

            if (!document.getElementById('namaTenant').value) return alert('Pilih/Isi Nama Tenant!');
            if (!editingRowIndex && !fotoBase64WithWatermark) return alert('Foto meteran wajib diambil!');
            if (padTeknisi.isEmpty()) return alert('Tanda tangan teknisi wajib diisi!');
            if (padTenant.isEmpty()) return alert('Tanda tangan tenant wajib diisi!');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Mengirim Data...';

            const payload = {
                action: editingRowIndex ? "UPDATE_RECORD" : "ADD_RECORD",
                rowIndex: editingRowIndex || null,
                kategoriSheet: document.getElementById('kategoriSheet').value,
                namaTenant: cleanName(document.getElementById('namaTenant').value),
                noLot: document.getElementById('noLot').value,
                serialNumber: document.getElementById('serialNumber').value,
                zona: document.getElementById('zona').value,
                jenisPencatatan: document.getElementById('jenisPencatatan').value,
                angka: parseFloat(document.getElementById('angka').value).toFixed(4),
                namaTeknisi: document.getElementById('namaTeknisi').value,
                namaPenandatanganTenant: document.getElementById('namaPenandatanganTenant').value,
                foto: fotoBase64WithWatermark,
                ttdTeknisi: padTeknisi.toDataURL(),
                ttdTenant: padTenant.toDataURL()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Tampilkan popup ucapan terima kasih
                showThankYouModal();
                fetchHistory();
            } catch (err) {
                alert('Gagal mengirim data: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = editingRowIndex ? 'Update Data Pencatatan' : 'Kirim Data Pencatatan';
            }
        };
    </script>
</body>
</html>
