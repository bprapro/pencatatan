<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Meteran Listrik & Air</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Signature Pad library -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        .canvas-container {
            position: relative;
            width: 100%;
            height: 160px;
            background-color: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 0.5rem;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-xl mx-auto px-4 py-5 text-center">
            <h1 class="text-2xl font-bold">Form Pencatatan Listrik & Air</h1>
            <p class="text-blue-100 text-sm mt-1">Form Digital Utility Check - Tenant Management</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto mt-6 px-4">
        <form id="utilityForm" class="bg-white rounded-lg shadow-md p-6 space-y-5">
            
            <!-- Information Section -->
            <div class="border-b pb-4">
                <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m-5 0v-5a1 1 0 011-1h1a1 1 0 011 1v5m-4 0h4"></path></svg>
                    Informasi Tenant & Lokasi
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dropdown / Search Tenant -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-gray-700 mb-1">Pilih Tenant / Lokasi <span class="text-red-500">*</span></label>
                        <select id="tenantSelect" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                            <option value="">-- Pilih Tenant --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Nama Tenant</label>
                        <input type="text" id="namaTenant" readonly required class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-md text-sm text-gray-700 font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">No Lot / Lokasi</label>
                        <input type="text" id="noLot" readonly required class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-md text-sm text-gray-700 font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Serial Number (SN)</label>
                        <input type="text" id="serialNumber" readonly class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-md text-sm text-gray-700 font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Zona / Area</label>
                        <input type="text" id="zona" readonly required class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-md text-sm text-gray-700 font-medium">
                    </div>
                </div>
            </div>

            <!-- Reading Section -->
            <div class="border-b pb-4">
                <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Data Pencatatan Meteran
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Jenis Pencatatan <span class="text-red-500">*</span></label>
                        <select id="jenisPencatatan" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <option value="Listrik">⚡ Listrik (kWh)</option>
                            <option value="Air">💧 Air (m³)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Angka Meteran (Hingga 4 desimal) <span class="text-red-500">*</span></label>
                        <input type="number" id="angka" step="0.0001" min="0" required placeholder="0000.0000"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                </div>

                <!-- Photo Input -->
                <div class="mt-4">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Foto Dokumentasi Meteran <span class="text-red-500">*</span></label>
                    <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden">
                    <button type="button" id="btnAmbilFoto" 
                            class="w-full py-2.5 px-4 border border-dashed border-gray-400 rounded-lg text-sm text-gray-600 flex items-center justify-center gap-2 hover:bg-gray-50 transition">
                        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><circle cx="12" cy="13" r="3" stroke-width="2"></circle></svg>
                        Ambil Foto Kamera / Pilih File
                    </button>
                    <div id="photoPreviewContainer" class="hidden mt-3 relative">
                        <img id="photoPreview" class="w-full h-48 object-cover rounded-lg border shadow-sm" alt="Preview">
                        <button type="button" id="btnHapusFoto" class="absolute top-2 right-2 bg-red-600 text-white p-1 rounded-full shadow hover:bg-red-700">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Signatures Section -->
            <div class="space-y-4">
                <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    Tanda Tangan & Verifikasi
                </h2>
                
                <!-- Teknisi Signature -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-gray-700">Tanda Tangan Teknisi <span class="text-red-500">*</span></label>
                        <button type="button" id="btnHapusPadTeknisi" class="text-xs text-red-600 hover:underline">Hapus TTD</button>
                    </div>
                    <div class="canvas-container">
                        <canvas id="teknisiCanvas"></canvas>
                    </div>
                    <input type="text" id="namaTeknisi" required placeholder="Nama Lengkap Teknisi"
                           class="w-full mt-2 px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>

                <!-- Tenant Signature -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-medium text-gray-700">Tanda Tangan Tenant <span class="text-red-500">*</span></label>
                        <button type="button" id="btnHapusPadTenant" class="text-xs text-red-600 hover:underline">Hapus TTD</button>
                    </div>
                    <div class="canvas-container">
                        <canvas id="tenantCanvas"></canvas>
                    </div>
                    <input type="text" id="namaPenandatanganTenant" required placeholder="Nama Lengkap Penandatangan (Pihak Tenant)"
                           class="w-full mt-2 px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" 
                    class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2">
                <span>Kirim Data Pencatatan</span>
            </button>
        </form>
    </main>

    <script>
        // MASTER DATA TENANT (Diambil dari Spreadsheet Anda)
        // Anda bisa menambah/mengedit daftarnya di dalam array ini
        const masterTenants = [
            { nama: "GUARDIAN", lokasi: "PB-FNB-L3-40", sn: "250916528", zona: "L3-A" },
            { nama: "GUARDIAN", lokasi: "PB-FNB-L3-41A", sn: "", zona: "L3-A" },
            { nama: "IMPERIAL KITCHEN", lokasi: "PB-FNB-L3-42", sn: "241249144", zona: "L3-A" },
            { nama: "KIDZSTATION", lokasi: "PB-FNB-L3-42B", sn: "241249133", zona: "L3-B" },
            { nama: "WATSONS", lokasi: "PB-FNB-L3-44", sn: "241190245", zona: "L3-A" },
            { nama: "SOLARIA", lokasi: "PB-FNB-L3-48", sn: "250114059", zona: "L3-A" },
            { nama: "LOLY POLY", lokasi: "PB-FNB-L3-71 ISO", sn: "241249157", zona: "L3-A" },
            { nama: "AOERA PARFUME", lokasi: "PB-FNB-L3-72 ISO", sn: "241249150", zona: "L3-A" },
            { nama: "BAK&CO", lokasi: "PB-RETAIL-L3-30", sn: "250228005", zona: "L3-B" },
            { nama: "EATERIA", lokasi: "TOTAL LISTRIK", sn: "", zona: "L3-B" },
            { nama: "SUSHI GO", lokasi: "PB-RETAIL-L3-31", sn: "241249215", zona: "L3-B" },
            { nama: "BAKOEL BAMBOE", lokasi: "PB-RETAIL-L3-32", sn: "250228070", zona: "L3-B" },
            { nama: "BAKOEL BAMBOE", lokasi: "PB-RETAIL-L3-33", sn: "250916247", zona: "L3-B" },
            { nama: "TOYS KINGDOM", lokasi: "PB-RETAIL-L3-35", sn: "250916503", zona: "L3-B" },
            { nama: "TOKO MAS BAGONG", lokasi: "PB-RETAIL-L3-37", sn: "241249180", zona: "L3-B" },
            { nama: "TOKO MAS SEMAR", lokasi: "PB-RETAIL-L3-38", sn: "241249143", zona: "L3-B" },
            { nama: "SEMBADA GOLD", lokasi: "PB-RETAIL-L3-39", sn: "250228001", zona: "L3-B" },
            { nama: "SHEM RAMEN", lokasi: "PB-RETAIL-L3-57A,57B", sn: "250228010", zona: "L3-B" },
            { nama: "WINGSTOP", lokasi: "PB-RETAIL-L3-58", sn: "", zona: "L3-B" },
            { nama: "WINGSTOP", lokasi: "PB-RETAIL-L3-59", sn: "", zona: "L3-B" },
            { nama: "MOTHERCARE,WILIO", lokasi: "PB-RETAIL-L3-60,61,62", sn: "250916522", zona: "L3-B" },
            { nama: "AREA KORIDOR SHEM RAMEN", lokasi: "PB-RETAIL-L3-66 ISO", sn: "250228093", zona: "L3-B" },
            { nama: "JOLLY TIME", lokasi: "PB-RETAIL-L3-67 ISO", sn: "250228029", zona: "L3-B" },
            { nama: "WINGSTOP", lokasi: "PB-RETAIL-L3-68 ISO", sn: "", zona: "L3-B" },
            { nama: "RICA-RICO", lokasi: "PB-RETAIL-L3-69A ISO", sn: "", zona: "L3-B" },
            { nama: "Alchemy Tea", lokasi: "PB-RETAIL-L3-69B ISO", sn: "241249198", zona: "L3-B" },
            { nama: "CINEMA XXI", lokasi: "351004 (Bedeng)", sn: "", zona: "L3-C" },
            { nama: "CINEMA XXI", lokasi: "1459050 (Tenant)", sn: "", zona: "L3-C" }
        ];

        let padTeknisi, padTenant;
        let fotoBase64 = '';

        function resizeCanvas(canvas) {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Populate Dropdown Tenant
            const selectEl = document.getElementById('tenantSelect');
            masterTenants.forEach((t, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `${t.nama} - ${t.lokasi} (${t.zona})`;
                selectEl.appendChild(opt);
            });

            // Auto-fill form saat tenant dipilih
            selectEl.addEventListener('change', (e) => {
                const idx = e.target.value;
                if (idx !== "") {
                    const selected = masterTenants[idx];
                    document.getElementById('namaTenant').value = selected.nama;
                    document.getElementById('noLot').value = selected.lokasi;
                    document.getElementById('serialNumber').value = selected.sn;
                    document.getElementById('zona').value = selected.zona;
                } else {
                    document.getElementById('namaTenant').value = '';
                    document.getElementById('noLot').value = '';
                    document.getElementById('serialNumber').value = '';
                    document.getElementById('zona').value = '';
                }
            });

            const canvasTeknisi = document.getElementById('teknisiCanvas');
            const canvasTenant = document.getElementById('tenantCanvas');

            resizeCanvas(canvasTeknisi);
            resizeCanvas(canvasTenant);

            padTeknisi = new SignaturePad(canvasTeknisi, { backgroundColor: 'rgb(255, 255, 255)' });
            padTenant = new SignaturePad(canvasTenant, { backgroundColor: 'rgb(255, 255, 255)' });

            document.getElementById('btnHapusPadTeknisi').addEventListener('click', () => padTeknisi.clear());
            document.getElementById('btnHapusPadTenant').addEventListener('click', () => padTenant.clear());
            
            document.getElementById('btnAmbilFoto').addEventListener('click', () => {
                document.getElementById('fotoInput').click();
            });

            document.getElementById('fotoInput').addEventListener('change', previewImage);
            document.getElementById('btnHapusFoto').addEventListener('click', removePhoto);
        });

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoBase64 = e.target.result;
                    document.getElementById('photoPreview').src = fotoBase64;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function removePhoto() {
            fotoBase64 = '';
            document.getElementById('fotoInput').value = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
        }

        // Form Submit Event
        document.getElementById('utilityForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const scriptUrl = 'https://script.google.com/macros/s/AKfycbxo4E63rCCM2HBqEzSZpyqKmgSRor0z_S8CLBH5FNWypR_jZLxEaGSlvEROiZlI_OZHYg/exec';

            if (padTeknisi.isEmpty()) {
                alert('Tanda tangan teknisi wajib diisi!');
                return;
            }

            if (padTenant.isEmpty()) {
                alert('Tanda tangan tenant wajib diisi!');
                return;
            }

            if (!fotoBase64) {
                alert('Foto dokumentasi wajib diambil/diupload!');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Mengirim Data...</span>';

            const payload = {
                namaTenant: document.getElementById('namaTenant').value,
                noLot: document.getElementById('noLot').value,
                serialNumber: document.getElementById('serialNumber').value,
                zona: document.getElementById('zona').value,
                jenisPencatatan: document.getElementById('jenisPencatatan').value,
                angka: parseFloat(document.getElementById('angka').value).toFixed(4),
                namaTeknisi: document.getElementById('namaTeknisi').value,
                namaPenandatanganTenant: document.getElementById('namaPenandatanganTenant').value,
                foto: fotoBase64,
                ttdTeknisi: padTeknisi.toDataURL(),
                ttdTenant: padTenant.toDataURL()
            };

            try {
                await fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('Data pencatatan berhasil dikirim!');
                
                document.getElementById('utilityForm').reset();
                padTeknisi.clear();
                padTenant.clear();
                removePhoto();
            } catch (err) {
                alert('Gagal mengirim data: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Kirim Data Pencatatan</span>';
            }
        });
    </script>
</body>
</html>
