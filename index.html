<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Meteran Listrik & Air</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        .canvas-container { position: relative; width: 100%; height: 160px; background-color: #f9fafb; border: 2px dashed #d1d5db; border-radius: 0.5rem; touch-action: none; }
        canvas { width: 100%; height: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-xl mx-auto px-4 py-5">
            <h1 class="text-xl font-bold">Form Pencatatan Listrik & Air</h1>
            <p class="text-blue-100 text-xs">Utility Check System</p>
        </div>
    </header>

    <main class="max-w-xl mx-auto mt-6 px-4 space-y-6">
        
        <form id="utilityForm" class="bg-white rounded-lg shadow-md p-6 space-y-5">
            
            <div id="editNotice" class="hidden bg-amber-50 border-l-4 border-amber-500 p-3 rounded text-xs text-amber-800 flex justify-between items-center">
                <span>⚠️ Mode Edit: Baris ke-<b id="editRowNumber"></b></span>
                <button type="button" id="btnCancelEdit" class="text-amber-700 underline font-semibold">Batal Edit</button>
            </div>

            <!-- STEP 1: KATEGORI -->
            <div class="border-b pb-4">
                <label class="block text-sm font-bold text-gray-800 mb-2">1. Pilih Kategori Master Data <span class="text-red-500">*</span></label>
                <select id="kategoriSheet" required class="w-full px-3 py-2.5 border-2 border-blue-500 bg-blue-50 rounded-lg text-sm font-semibold text-blue-900 focus:ring-2 focus:ring-blue-600">
                    <option value="" disabled selected>-- Pilih Kategori Utility --</option>
                    <option value="AIR">💧 AIR TENANT</option>
                    <option value="AIR EATERIA">💧 AIR EATERIA</option>
                    <option value="LISTRIK TENANT">⚡ LISTRIK TENANT</option>
                    <option value="LISTRIK EATERIA">⚡ LISTRIK EATERIA</option>
                    <option value="LISTRIK STORAGE">⚡ LISTRIK STORAGE</option>
                </select>
            </div>

            <!-- STEP 2: TENANT -->
            <div id="sectionTenant" class="border-b pb-4 opacity-50 pointer-events-none transition-all">
                <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m-5 0v-5a1 1 0 011-1h1a1 1 0 011 1v5m-4 0h4"></path></svg>
                    2. Pilih Tenant / Lokasi
                </h2>

                <div class="space-y-3">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
                        <input type="text" id="tenantSearchInput" autocomplete="off" placeholder="Ketik nama tenant / No Lot..."
                               class="w-full pl-9 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div class="border border-gray-300 rounded-lg max-h-48 overflow-y-auto bg-white divide-y divide-gray-100" id="tenantListBox">
                        <div class="p-3 text-center text-xs text-gray-400">Pilih kategori utility terlebih dahulu...</div>
                    </div>
                </div>

                <input type="hidden" id="editingRowIndex" value="">
                <input type="hidden" id="namaTenant" required>
                <input type="hidden" id="noLot">

                <div id="lotDropdownContainer" class="hidden mt-3">
                    <label class="block text-xs font-semibold text-blue-700 mb-1">Pilih No Lot / Lokasi Spesifik:</label>
                    <select id="lotSelectDropdown" class="w-full px-3 py-2 border border-blue-500 bg-blue-50 rounded-md text-sm font-semibold text-blue-900"></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Serial Number (SN)</label>
                        <input type="text" id="serialNumber" placeholder="Ketik SN..." class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Zona / Area</label>
                        <input type="text" id="zona" placeholder="Ketik Zona..." class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                    </div>
                </div>
            </div>

            <!-- STEP 3: DATA PENCATATAN & FOTO -->
            <div class="border-b pb-4">
                <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    3. Data Pencatatan & Foto
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Jenis Utility <span class="text-red-500">*</span></label>
                        <input type="text" id="jenisPencatatan" readonly class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md text-sm font-bold text-gray-700">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Angka Meteran <span class="text-red-500">*</span></label>
                        <input type="number" id="angka" step="0.0001" min="0" required placeholder="0000.0000" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                    </div>
                </div>

                <!-- PILIHAN AMBIL FOTO / UPLOAD FOTO -->
                <div class="mt-4">
                    <label class="block text-xs font-medium text-gray-700 mb-2">Foto Dokumentasi Meteran <span class="text-red-500">*</span></label>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <!-- Tombol Buka Kamera -->
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                        <button type="button" id="btnBukaKamera" class="py-2.5 bg-blue-50 border border-blue-300 rounded-lg text-xs font-semibold text-blue-700 flex items-center justify-center gap-2 hover:bg-blue-100">
                            📷 Buka Kamera
                        </button>

                        <!-- Tombol Upload Foto -->
                        <input type="file" id="galleryInput" accept="image/*" class="hidden">
                        <button type="button" id="btnUploadFoto" class="py-2.5 bg-emerald-50 border border-emerald-300 rounded-lg text-xs font-semibold text-emerald-700 flex items-center justify-center gap-2 hover:bg-emerald-100">
                            📁 Upload dari Galeri
                        </button>
                    </div>

                    <!-- PREVIEW FOTO WATERMARK -->
                    <div id="photoPreviewContainer" class="hidden mt-3 relative">
                        <img id="photoPreview" class="w-full h-auto max-h-80 object-contain rounded-lg border shadow-sm" alt="Preview foto watermark">
                        <button type="button" id="btnHapusFoto" class="absolute top-2 right-2 bg-red-600 text-white p-1 rounded-full shadow hover:bg-red-700">✕</button>
                    </div>
                </div>
            </div>

            <!-- STEP 4: TANDA TANGAN & NAMA -->
            <div class="space-y-4">
                <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    4. Verifikasi Tanda Tangan
                </h2>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-medium text-gray-700">Tanda Tangan Teknisi *</label>
                        <button type="button" id="btnHapusPadTeknisi" class="text-xs text-red-600 hover:underline">Hapus TTD</button>
                    </div>
                    <div class="canvas-container"><canvas id="teknisiCanvas"></canvas></div>
                    <input type="text" id="namaTeknisi" required placeholder="Nama Lengkap Teknisi" class="w-full mt-2 px-3 py-1.5 border border-gray-300 rounded-md text-xs">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-medium text-gray-700">Tanda Tangan Tenant *</label>
                        <button type="button" id="btnHapusPadTenant" class="text-xs text-red-600 hover:underline">Hapus TTD</button>
                    </div>
                    <div class="canvas-container"><canvas id="tenantCanvas"></canvas></div>
                    <input type="text" id="namaPenandatanganTenant" required placeholder="Nama Lengkap Penandatangan (Tenant)" class="w-full mt-2 px-3 py-1.5 border border-gray-300 rounded-md text-xs">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700">
                Kirim Data Pencatatan
            </button>
        </form>

        <!-- RIWAYAT -->
        <section class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center justify-between">
                <span>📋 Riwayat LOGSET (Terakhir)</span>
                <button id="btnRefreshHistory" type="button" class="text-xs text-blue-600 hover:underline">🔄 Refresh</button>
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-600 border-collapse">
                    <thead class="bg-gray-50 text-gray-700 border-b">
                        <tr>
                            <th class="p-2">Kategori & Tenant</th>
                            <th class="p-2">Jenis</th>
                            <th class="p-2">Angka</th>
                            <th class="p-2 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y">
                        <tr><td colspan="4" class="p-3 text-center text-gray-400">Memuat riwayat...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxIZRUVgCOfgzC9YhrQd-VlEexaZExoBGxy4gUMULoPxlJiwp3oFlM10O0NNt_05-s0bQ/exec';

        let rawMasterTenants = [];
        let groupedTenants = {}; 
        let historyList = [];
        let selectedTenantGroup = null;
        let padTeknisi, padTenant;
        let fotoBase64WithWatermark = '';

        function cleanName(name) {
            if (!name) return '';
            return String(name).replace(/^\d+[\s\-\.\)]*/, '').trim();
        }

        function resizeCanvas(canvas) {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
        }

        async function fetchMasterByCategory(category) {
            const box = document.getElementById('tenantListBox');
            box.innerHTML = `<div class="p-3 text-center text-xs text-blue-500 font-semibold">Memuat data dari sheet ${category}...</div>`;
            
            try {
                const res = await fetch(`${SCRIPT_URL}?action=GET_MASTER_BY_CATEGORY&category=${encodeURIComponent(category)}`);
                rawMasterTenants = await res.json();
                
                groupedTenants = {};
                rawMasterTenants.forEach((t) => {
                    let displayName = cleanName(t.nama);
                    if (!displayName) displayName = t.lokasi || 'Tanpa Nama';

                    if (!groupedTenants[displayName]) {
                        groupedTenants[displayName] = { displayName: displayName, items: [] };
                    }
                    groupedTenants[displayName].items.push({
                        namaAsli: t.nama || '',
                        lokasi: t.lokasi || '',
                        sn: t.sn || '',
                        zona: t.zona || ''
                    });
                });

                renderTenantList('');
            } catch (err) {
                box.innerHTML = `<div class="p-3 text-center text-xs text-red-500">Gagal memuat master data sheet ${category}</div>`;
            }
        }

        function renderTenantList(filterKeyword = '') {
            const box = document.getElementById('tenantListBox');
            box.innerHTML = '';

            const keys = Object.keys(groupedTenants);
            const filtered = keys.filter(nameKey => {
                const grp = groupedTenants[nameKey];
                const matchName = nameKey.toLowerCase().includes(filterKeyword.toLowerCase());
                const matchSub = grp.items.some(it => `${it.lokasi} ${it.sn} ${it.zona}`.toLowerCase().includes(filterKeyword.toLowerCase()));
                return matchName || matchSub;
            });

            if (filtered.length === 0) {
                box.innerHTML = `<div class="p-3 text-center text-xs text-gray-400">Tidak ada data tenant di sheet ini</div>`;
                return;
            }

            filtered.forEach((key) => {
                const group = groupedTenants[key];
                const isSelected = selectedTenantGroup && selectedTenantGroup.displayName === key;
                const row = document.createElement('div');
                row.className = `p-3 flex items-center gap-3 cursor-pointer transition hover:bg-blue-50 ${isSelected ? 'bg-blue-50 border-l-4 border-blue-600' : ''}`;
                
                const countItems = group.items.length;
                const badgeInfo = countItems > 1 ? `<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold">${countItems} Lot</span>` : '';

                row.innerHTML = `
                    <input type="radio" name="tenantRadio" class="w-4 h-4 text-blue-600 pointer-events-none" ${isSelected ? 'checked' : ''}>
                    <div class="text-sm flex items-center justify-between w-full">
                        <span class="font-bold text-gray-800">${group.displayName}</span>
                        ${badgeInfo}
                    </div>
                `;
                row.onclick = () => selectTenantGroup(group);
                box.appendChild(row);
            });
        }

        function selectTenantGroup(group) {
            selectedTenantGroup = group;
            const dropdownContainer = document.getElementById('lotDropdownContainer');
            const selectDropdown = document.getElementById('lotSelectDropdown');

            if (group.items.length > 1) {
                dropdownContainer.classList.remove('hidden');
                selectDropdown.innerHTML = group.items.map((item, idx) => {
                    return `<option value="${idx}">Lot: ${item.lokasi || '-'} | SN: ${item.sn || '-'}</option>`;
                }).join('');
                selectDropdown.onchange = () => applySubItemSelection(group.items[selectDropdown.value]);
                applySubItemSelection(group.items[0]);
            } else if (group.items.length === 1) {
                dropdownContainer.classList.add('hidden');
                applySubItemSelection(group.items[0]);
            }

            renderTenantList(document.getElementById('tenantSearchInput').value);
        }

        function applySubItemSelection(item) {
            document.getElementById('namaTenant').value = item.namaAsli || item.lokasi;
            document.getElementById('noLot').value = item.lokasi || '';
            document.getElementById('serialNumber').value = item.sn || '';
            document.getElementById('zona').value = item.zona || '';
        }

        // FUNGSI UTAMA WATERMARK PADA GAMBAR
        function processImageWatermark(file) {
            const namaTenant = document.getElementById('namaTenant').value || '-';
            const namaPenandatangan = document.getElementById('namaPenandatanganTenant').value || '-';
            const namaTeknisi = document.getElementById('namaTeknisi').value || '-';
            const serialNumber = document.getElementById('serialNumber').value || '-';

            // Format tanggal & jam WIB
            const now = new Date();
            const timeString = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' ' + 
                               now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Konfigurasi Watermark Box
                    const fontSize = Math.max(16, Math.floor(canvas.width / 35));
                    ctx.font = `bold ${fontSize}px sans-serif`;

                    const line1 = `${namaTenant} (${namaPenandatangan})`;
                    const line2 = `${timeString} (${namaTeknisi})`;
                    const line3 = `SN: ${serialNumber}`;

                    const padding = fontSize * 0.8;
                    const lineHeight = fontSize * 1.35;
                    const boxHeight = (lineHeight * 3) + (padding * 2);
                    const boxWidth = Math.max(
                        ctx.measureText(line1).width,
                        ctx.measureText(line2).width,
                        ctx.measureText(line3).width
                    ) + (padding * 2);

                    const x = padding;
                    const y = canvas.height - boxHeight - padding;

                    // Draw Background Transparan Soft Black
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                    ctx.fillRect(x, y, boxWidth, boxHeight);

                    // Draw Text Watermark (Warna Kuning & Putih)
                    ctx.textBaseline = 'top';
                    
                    ctx.fillStyle = '#fde047'; // Line 1 Yellow
                    ctx.fillText(line1, x + padding, y + padding);

                    ctx.fillStyle = '#ffffff'; // Line 2 White
                    ctx.fillText(line2, x + padding, y + padding + lineHeight);

                    ctx.fillStyle = '#38bdf8'; // Line 3 Light Blue (SN)
                    ctx.fillText(line3, x + padding, y + padding + (lineHeight * 2));

                    fotoBase64WithWatermark = canvas.toDataURL('image/jpeg', 0.85);
                    document.getElementById('photoPreview').src = fotoBase64WithWatermark;
                    document.getElementById('photoPreviewContainer').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function fetchHistory() {
            const tbody = document.getElementById('historyTableBody');
            try {
                const res = await fetch(`${SCRIPT_URL}?action=GET_HISTORY`);
                historyList = await res.json();

                tbody.innerHTML = '';
                if (historyList.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-gray-400">Belum ada riwayat di LOGSET</td></tr>`;
                    return;
                }

                historyList.forEach((item, index) => {
                    const cleanNama = cleanName(item.namaTenant) || item.noLot;
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="p-2">
                            <span class="text-[10px] bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded font-bold">${item.kategoriSheet}</span>
                            <div class="font-bold text-gray-800 mt-1">${cleanNama}</div>
                            <div class="text-[10px] text-gray-500">Lot: ${item.noLot || '-'} | SN: ${item.sn || '-'}</div>
                        </td>
                        <td class="p-2 font-semibold">${item.jenis}</td>
                        <td class="p-2 font-mono font-bold text-blue-600">${item.angka}</td>
                        <td class="p-2 text-center">
                            <button type="button" onclick="editHistoryItem(${index})" class="bg-amber-500 text-white px-2 py-1 rounded text-[10px] font-semibold hover:bg-amber-600 shadow">✏️ Edit</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-red-500">Gagal memuat riwayat</td></tr>`;
            }
        }

        function cancelEditMode() {
            document.getElementById('editingRowIndex').value = '';
            document.getElementById('editNotice').classList.add('hidden');
            document.getElementById('utilityForm').reset();
            document.getElementById('sectionTenant').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('lotDropdownContainer').classList.add('hidden');
            selectedTenantGroup = null;
            fotoBase64WithWatermark = '';
            document.getElementById('photoPreviewContainer').classList.add('hidden');
            document.getElementById('tenantListBox').innerHTML = `<div class="p-3 text-center text-xs text-gray-400">Pilih kategori utility terlebih dahulu...</div>`;

            document.getElementById('submitBtn').innerText = 'Kirim Data Pencatatan';
            document.getElementById('submitBtn').className = 'w-full py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700';
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchHistory();

            document.getElementById('btnRefreshHistory').onclick = fetchHistory;
            document.getElementById('btnCancelEdit').onclick = cancelEditMode;
            document.getElementById('tenantSearchInput').addEventListener('input', (e) => renderTenantList(e.target.value));

            document.getElementById('kategoriSheet').addEventListener('change', (e) => {
                const category = e.target.value;
                const sectionTenant = document.getElementById('sectionTenant');
                const jenisInput = document.getElementById('jenisPencatatan');

                if (category) {
                    sectionTenant.classList.remove('opacity-50', 'pointer-events-none');
                    jenisInput.value = category.startsWith('AIR') ? 'Air (m³)' : 'Listrik (kWh)';
                    selectedTenantGroup = null;
                    fetchMasterByCategory(category);
                }
            });

            // HANDLER FOTO & KAMERA
            document.getElementById('btnBukaKamera').onclick = () => document.getElementById('cameraInput').click();
            document.getElementById('btnUploadFoto').onclick = () => document.getElementById('galleryInput').click();

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) processImageWatermark(file);
            };

            document.getElementById('cameraInput').onchange = handleFileSelect;
            document.getElementById('galleryInput').onchange = handleFileSelect;

            document.getElementById('btnHapusFoto').onclick = () => {
                fotoBase64WithWatermark = '';
                document.getElementById('cameraInput').value = '';
                document.getElementById('galleryInput').value = '';
                document.getElementById('photoPreviewContainer').classList.add('hidden');
            };

            const canvasTeknisi = document.getElementById('teknisiCanvas');
            const canvasTenant = document.getElementById('tenantCanvas');
            resizeCanvas(canvasTeknisi);
            resizeCanvas(canvasTenant);

            padTeknisi = new SignaturePad(canvasTeknisi, { backgroundColor: 'rgb(255, 255, 255)' });
            padTenant = new SignaturePad(canvasTenant, { backgroundColor: 'rgb(255, 255, 255)' });

            document.getElementById('btnHapusPadTeknisi').onclick = () => padTeknisi.clear();
            document.getElementById('btnHapusPadTenant').onclick = () => padTenant.clear();
        });

        document.getElementById('utilityForm').onsubmit = async function(e) {
            e.preventDefault();
            const editingRowIndex = document.getElementById('editingRowIndex').value;

            if (!document.getElementById('namaTenant').value) {
                return alert('Pilih salah satu Tenant / Lokasi!');
            }
            if (!fotoBase64WithWatermark) {
                return alert('Foto meteran wajib diambil/diupload!');
            }
            if (padTeknisi.isEmpty()) return alert('Tanda tangan teknisi wajib diisi!');
            if (padTenant.isEmpty()) return alert('Tanda tangan tenant wajib diisi!');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Mengirim Data...';

            const payload = {
                action: editingRowIndex ? "UPDATE_RECORD" : "ADD_RECORD",
                rowIndex: editingRowIndex || null,
                kategoriSheet: document.getElementById('kategoriSheet').value,
                namaTenant: cleanName(document.getElementById('namaTenant').value),
                noLot: document.getElementById('noLot').value,
                serialNumber: document.getElementById('serialNumber').value,
                zona: document.getElementById('zona').value,
                jenisPencatatan: document.getElementById('jenisPencatatan').value,
                angka: parseFloat(document.getElementById('angka').value).toFixed(4),
                namaTeknisi: document.getElementById('namaTeknisi').value,
                namaPenandatanganTenant: document.getElementById('namaPenandatanganTenant').value,
                foto: fotoBase64WithWatermark,
                ttdTeknisi: padTeknisi.toDataURL(),
                ttdTenant: padTenant.toDataURL()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('Data pencatatan beserta foto timestamp berhasil disimpan!');
                cancelEditMode();
                padTeknisi.clear();
                padTenant.clear();
                setTimeout(fetchHistory, 1500);
            } catch (err) {
                alert('Gagal mengirim data: ' + err.message);
            } finally {
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
