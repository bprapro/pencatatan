<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Meteran Listrik & Air</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <style>
        .canvas-container { position: relative; width: 100%; height: 160px; background-color: #f9fafb; border: 2px dashed #d1d5db; border-radius: 0.5rem; touch-action: none; }
        canvas { width: 100%; height: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12">

    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-xl mx-auto px-4 py-5 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Form Pencatatan Listrik & Air</h1>
                <p class="text-blue-100 text-xs">Utility Check System</p>
            </div>
            <button id="btnOpenManageModal" type="button" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-3 py-2 rounded-lg font-medium border border-blue-400 transition shadow">
                ⚙️ Kelola Master Tenant
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto mt-6 px-4">
        <form id="utilityForm" class="bg-white rounded-lg shadow-md p-6 space-y-5">
            
            <!-- Informasi Tenant & Lokasi -->
            <div class="border-b pb-4">
                <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m-5 0v-5a1 1 0 011-1h1a1 1 0 011 1v5m-4 0h4"></path></svg>
                    Pilih Tenant / Lokasi
                </h2>

                <!-- UI Model Filter Box sesuai gambar -->
                <div class="space-y-3">
                    <!-- Input Search Filter -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                            🔍
                        </span>
                        <input type="text" id="tenantSearchInput" autocomplete="off" placeholder="Ketik nama tenant / No Lot..."
                               class="w-full pl-9 pr-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                    </div>

                    <!-- Scrollable List Box Option -->
                    <div class="border border-gray-300 rounded-lg max-h-56 overflow-y-auto bg-white divide-y divide-gray-100" id="tenantListBox">
                        <div class="p-3 text-center text-xs text-gray-400">Memuat daftar tenant...</div>
                    </div>
                </div>

                <!-- Hidden Input Hasil Choice -->
                <input type="hidden" id="namaTenant" required>
                <input type="hidden" id="noLot" required>

                <!-- Detail Read-only dari Tenant Terpilih -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Serial Number (SN)</label>
                        <input type="text" id="serialNumber" readonly class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-md text-sm font-medium text-gray-700">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Zona / Area</label>
                        <input type="text" id="zona" readonly required class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-md text-sm font-medium text-gray-700">
                    </div>
                </div>
            </div>

            <!-- Pencatatan Meteran -->
            <div class="border-b pb-4">
                <h2 class="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Data Pencatatan Meteran
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Jenis Pencatatan <span class="text-red-500">*</span></label>
                        <select id="jenisPencatatan" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                            <option value="Listrik">⚡ Listrik (kWh)</option>
                            <option value="Air">💧 Air (m³)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Angka Meteran <span class="text-red-500">*</span></label>
                        <input type="number" id="angka" step="0.0001" min="0" required placeholder="0000.0000" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Foto Dokumentasi Meteran <span class="text-red-500">*</span></label>
                    <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden">
                    <button type="button" id="btnAmbilFoto" class="w-full py-2.5 border border-dashed border-gray-400 rounded-lg text-sm text-gray-600 flex items-center justify-center gap-2 hover:bg-gray-50">
                        📸 Ambil Foto Kamera / Pilih File
                    </button>
                    <div id="photoPreviewContainer" class="hidden mt-3 relative">
                        <img id="photoPreview" class="w-full h-48 object-cover rounded-lg border shadow-sm" alt="Preview">
                        <button type="button" id="btnHapusFoto" class="absolute top-2 right-2 bg-red-600 text-white p-1 rounded-full shadow">✕</button>
                    </div>
                </div>
            </div>

            <!-- TTD -->
            <div class="space-y-4">
                <h2 class="text-base font-semibold text-gray-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    Tanda Tangan & Verifikasi
                </h2>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-medium text-gray-700">Tanda Tangan Teknisi *</label>
                        <button type="button" id="btnHapusPadTeknisi" class="text-xs text-red-600 hover:underline">Hapus TTD</button>
                    </div>
                    <div class="canvas-container"><canvas id="teknisiCanvas"></canvas></div>
                    <input type="text" id="namaTeknisi" required placeholder="Nama Lengkap Teknisi" class="w-full mt-2 px-3 py-1.5 border border-gray-300 rounded-md text-xs">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-medium text-gray-700">Tanda Tangan Tenant *</label>
                        <button type="button" id="btnHapusPadTenant" class="text-xs text-red-600 hover:underline">Hapus TTD</button>
                    </div>
                    <div class="canvas-container"><canvas id="tenantCanvas"></canvas></div>
                    <input type="text" id="namaPenandatanganTenant" required placeholder="Nama Lengkap Penandatangan (Tenant)" class="w-full mt-2 px-3 py-1.5 border border-gray-300 rounded-md text-xs">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700">
                Kirim Data Pencatatan
            </button>
        </form>
    </main>

    <!-- MODAL KELOLA MASTER TENANT -->
    <div id="manageModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-800 text-lg">Kelola Master Data Tenant</h3>
                <button id="btnCloseManageModal" type="button" class="text-gray-500 hover:text-red-600 font-bold text-xl">&times;</button>
            </div>

            <form id="addTenantForm" class="mt-4 border-b pb-4 space-y-3">
                <h4 class="text-sm font-semibold text-blue-600">+ Tambah Tenant Baru</h4>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="newNama" required placeholder="Nama Tenant" class="px-2 py-1.5 border rounded text-xs">
                    <input type="text" id="newLokasi" required placeholder="No Lot / Lokasi" class="px-2 py-1.5 border rounded text-xs">
                    <input type="text" id="newSN" placeholder="Serial Number (Opsional)" class="px-2 py-1.5 border rounded text-xs">
                    <input type="text" id="newZona" required placeholder="Zona (contoh: L3-A)" class="px-2 py-1.5 border rounded text-xs">
                </div>
                <button type="submit" id="btnAddTenantSubmit" class="w-full py-2 bg-green-600 text-white text-xs font-semibold rounded hover:bg-green-700">
                    Simpan Tenant Baru
                </button>
            </form>

            <div class="mt-4">
                <h4 class="text-sm font-semibold text-gray-700 mb-2">Daftar Tenant (Hapus Data)</h4>
                <div id="tenantListContainer" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400">Memuat data...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxIZRUVgCOfgzC9YhrQd-VlEexaZExoBGxy4gUMULoPxlJiwp3oFlM10O0NNt_05-s0bQ/exec';

        let masterTenants = [];
        let selectedTenantObj = null;
        let padTeknisi, padTenant;
        let fotoBase64 = '';

        function resizeCanvas(canvas) {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
        }

        async function fetchMasterTenant() {
            const listContainer = document.getElementById('tenantListContainer');
            try {
                const res = await fetch(SCRIPT_URL);
                masterTenants = await res.json();

                listContainer.innerHTML = '';
                masterTenants.forEach((t) => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'flex justify-between items-center bg-gray-50 p-2 rounded text-xs border';
                    rowDiv.innerHTML = `
                        <div>
                            <span class="font-bold text-gray-800">${t.nama}</span> - <span class="text-gray-600">${t.lokasi}</span>
                            <span class="text-gray-400 block">SN: ${t.sn || '-'} | Zona: ${t.zona}</span>
                        </div>
                        <button onclick="deleteTenant('${t.nama}', '${t.lokasi}')" class="bg-red-500 text-white px-2 py-1 rounded text-[10px] hover:bg-red-700">Hapus</button>
                    `;
                    listContainer.appendChild(rowDiv);
                });

                renderTenantList('');
            } catch (err) {
                console.error(err);
                document.getElementById('tenantListBox').innerHTML = `<div class="p-3 text-center text-xs text-red-500">Gagal mengambil data master!</div>`;
            }
        }

        function renderTenantList(filterKeyword = '') {
            const box = document.getElementById('tenantListBox');
            box.innerHTML = '';

            const filtered = masterTenants.filter(t => {
                const searchStr = `${t.nama} ${t.lokasi} ${t.zona}`.toLowerCase();
                return searchStr.includes(filterKeyword.toLowerCase());
            });

            if (filtered.length === 0) {
                box.innerHTML = `<div class="p-3 text-center text-xs text-gray-400">Tidak ada tenant / lokasi yang sesuai</div>`;
                return;
            }

            filtered.forEach((t) => {
                const isSelected = selectedTenantObj && selectedTenantObj.nama === t.nama && selectedTenantObj.lokasi === t.lokasi;
                const row = document.createElement('div');
                row.className = `p-3 flex items-center gap-3 cursor-pointer transition hover:bg-blue-50 ${isSelected ? 'bg-blue-50 border-l-4 border-blue-600' : ''}`;
                
                row.innerHTML = `
                    <input type="radio" name="tenantRadio" class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500 pointer-events-none" ${isSelected ? 'checked' : ''}>
                    <div class="text-sm">
                        <span class="font-bold text-gray-800">${t.nama}</span>
                        <span class="text-gray-500 font-medium"> - ${t.lokasi}</span>
                        <span class="text-xs text-gray-400 font-normal"> [${t.zona}]</span>
                    </div>
                `;

                row.onclick = () => selectTenantItem(t);
                box.appendChild(row);
            });
        }

        function selectTenantItem(t) {
            selectedTenantObj = t;
            
            document.getElementById('namaTenant').value = t.nama;
            document.getElementById('noLot').value = t.lokasi;
            document.getElementById('zona').value = t.zona;

            const snInput = document.getElementById('serialNumber');
            if (t.sn) {
                snInput.value = t.sn;
                snInput.readOnly = true;
                snInput.className = "w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-md text-sm font-medium text-gray-700";
            } else {
                snInput.value = '';
                snInput.readOnly = false;
                snInput.placeholder = "Ketik Serial Number Baru...";
                snInput.className = "w-full px-3 py-2 border border-yellow-400 bg-yellow-50 rounded-md text-sm font-medium focus:ring-2 focus:ring-yellow-500";
            }

            renderTenantList(document.getElementById('tenantSearchInput').value);
        }

        async function deleteTenant(nama, lokasi) {
            if (!confirm(`Yakin ingin menghapus tenant "${nama}" (${lokasi})?`)) return;
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "DELETE_TENANT", nama, lokasi })
                });
                alert('Permintaan hapus terkirim!');
                setTimeout(fetchMasterTenant, 1500);
            } catch (e) {
                alert('Gagal menghapus: ' + e.message);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchMasterTenant();

            document.getElementById('tenantSearchInput').addEventListener('input', (e) => {
                renderTenantList(e.target.value);
            });

            // Canvas Init
            const canvasTeknisi = document.getElementById('teknisiCanvas');
            const canvasTenant = document.getElementById('tenantCanvas');
            resizeCanvas(canvasTeknisi);
            resizeCanvas(canvasTenant);

            padTeknisi = new SignaturePad(canvasTeknisi, { backgroundColor: 'rgb(255, 255, 255)' });
            padTenant = new SignaturePad(canvasTenant, { backgroundColor: 'rgb(255, 255, 255)' });

            document.getElementById('btnHapusPadTeknisi').onclick = () => padTeknisi.clear();
            document.getElementById('btnHapusPadTenant').onclick = () => padTenant.clear();

            // Photo Handler
            document.getElementById('btnAmbilFoto').onclick = () => document.getElementById('fotoInput').click();
            document.getElementById('fotoInput').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        fotoBase64 = evt.target.result;
                        document.getElementById('photoPreview').src = fotoBase64;
                        document.getElementById('photoPreviewContainer').classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            };
            document.getElementById('btnHapusFoto').onclick = () => {
                fotoBase64 = '';
                document.getElementById('fotoInput').value = '';
                document.getElementById('photoPreviewContainer').classList.add('hidden');
            };

            // Modal Handlers
            const modal = document.getElementById('manageModal');
            document.getElementById('btnOpenManageModal').onclick = () => modal.classList.remove('hidden');
            document.getElementById('btnCloseManageModal').onclick = () => modal.classList.add('hidden');

            // Tambah Tenant Form
            document.getElementById('addTenantForm').onsubmit = async (e) => {
                e.preventDefault();
                const submitBtn = document.getElementById('btnAddTenantSubmit');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Menyimpan...';

                const newPayload = {
                    action: "ADD_TENANT",
                    nama: document.getElementById('newNama').value,
                    lokasi: document.getElementById('newLokasi').value,
                    sn: document.getElementById('newSN').value,
                    zona: document.getElementById('newZona').value
                };

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newPayload)
                    });
                    alert('Tenant berhasil ditambahkan!');
                    document.getElementById('addTenantForm').reset();
                    setTimeout(fetchMasterTenant, 1500);
                } catch (err) {
                    alert('Gagal menambah tenant: ' + err.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Simpan Tenant Baru';
                }
            };
        });

        // Form Submit Utama
        document.getElementById('utilityForm').onsubmit = async function(e) {
            e.preventDefault();
            if (!document.getElementById('namaTenant').value || !document.getElementById('noLot').value) {
                return alert('Pilih salah satu Tenant/Lokasi dari list!');
            }
            if (padTeknisi.isEmpty()) return alert('Tanda tangan teknisi wajib diisi!');
            if (padTenant.isEmpty()) return alert('Tanda tangan tenant wajib diisi!');
            if (!fotoBase64) return alert('Foto wajib diupload!');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Mengirim Data...</span>';

            const payload = {
                namaTenant: document.getElementById('namaTenant').value,
                noLot: document.getElementById('noLot').value,
                serialNumber: document.getElementById('serialNumber').value,
                zona: document.getElementById('zona').value,
                jenisPencatatan: document.getElementById('jenisPencatatan').value,
                angka: parseFloat(document.getElementById('angka').value).toFixed(4),
                namaTeknisi: document.getElementById('namaTeknisi').value,
                namaPenandatanganTenant: document.getElementById('namaPenandatanganTenant').value,
                foto: fotoBase64,
                ttdTeknisi: padTeknisi.toDataURL(),
                ttdTenant: padTenant.toDataURL()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('Data pencatatan berhasil dikirim!');
                document.getElementById('utilityForm').reset();
                selectedTenantObj = null;
                renderTenantList('');
                padTeknisi.clear();
                padTenant.clear();
                document.getElementById('btnHapusFoto').click();
            } catch (err) {
                alert('Gagal mengirim data: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Kirim Data Pencatatan</span>';
            }
        };
    </script>
</body>
</html>
